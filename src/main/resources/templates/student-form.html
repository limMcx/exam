<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Данные студента</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 40px auto;
            padding: 0 20px;
        }

        label {
            display: block;
            margin-top: 20px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            margin-top: 25px;
            padding: 12px 18px;
            border: none;
            border-radius: 5px;
            background: #1677ff;
            color: white;
            cursor: pointer;
        }

        .error {
            color: #dc3545;
            margin-top: 5px;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<h1 th:text="${student.id == null
    ? 'Добавить студента'
    : 'Редактировать студента'}">
    Данные студента
</h1>

<form th:action="@{/students}"
      th:object="${student}"
      method="post">

    <input type="hidden" th:field="*{id}">

    <label for="name">Имя студента</label>

    <input type="text"
           id="name"
           th:field="*{name}"
           placeholder="Например, Иван Иванов"
           required>

    <div class="error"
         th:if="${#fields.hasErrors('name')}"
         th:errors="*{name}">
    </div>

    <label for="email">Email</label>

    <input type="email"
           id="email"
           th:field="*{email}"
           placeholder="ivan@example.com"
           required>

    <div class="error"
         th:if="${#fields.hasErrors('email')}"
         th:errors="*{email}">
    </div>

    <button type="submit"
            th:text="${student.id == null ? 'Добавить студента' : 'Сохранить изменения'}">
        Сохранить
    </button>

</form>

<a class="back" th:href="@{/students}">
    ← Назад к списку
</a>

</body>
</html>
